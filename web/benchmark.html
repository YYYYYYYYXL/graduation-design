<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批量评测 · 图像去噪系统</title>
  <link rel="stylesheet" href="/static/style.css?v=13">
</head>
<body>
  <header>
    <a class="brand" href="/">图像去噪系统</a>
    <nav aria-label="功能页面">
      <a class="nav-link" href="/">单图实验</a>
      <a class="nav-link active" href="/benchmark" aria-current="page">批量评测</a>
    </nav>
  </header>
  <main class="benchmark">
    <section class="panel">
      <h1>批量评测</h1>
      <p class="muted">在相同的测试图和干净参考图上比较各模型。先看平均分，再点选单张样本检查细节。</p>
      <form id="batch-form">
        <fieldset><legend>测试组</legend><div id="batch-groups" class="checks"></div></fieldset>
        <fieldset><legend>对比方法</legend><div id="batch-models" class="checks"></div></fieldset>
        <div class="batch-actions">
          <button class="primary" id="batch-start" type="submit" disabled>开始批量评测</button>
          <button id="batch-preview" type="submit" disabled>预览 · 每组 1 张</button>
          <span id="batch-selection" class="muted"></span>
        </div>
        <p id="batch-error" class="error" role="alert"></p>
      </form>
    </section>
    <section id="batch-report" class="panel" hidden>
      <div class="section-title">
        <h2>评测汇总</h2>
        <label class="batch-picker">历史评测 <select id="batch-runs"></select></label>
      </div>
      <p id="batch-state" role="status"></p>
      <progress id="batch-progress" max="1" value="0" aria-label="评测进度"></progress>
      <p class="muted">分数为平均 PSNR（dB）/ SSIM，Δ 表示相对去噪前的 PSNR 提升。各组按所有已选方法都成功的样本计分，耗时以秒/张计。</p>
      <section class="batch-charts" aria-labelledby="batch-chart-title">
        <div class="batch-chart-header">
          <h3 id="batch-chart-title">结果可视化</h3>
          <div class="batch-chart-tabs" role="group" aria-label="图表视图">
            <button type="button" data-chart-view="ranking" aria-pressed="true">模型排名</button>
            <button type="button" data-chart-view="trend" aria-pressed="false">DIV2K 噪声趋势</button>
          </div>
        </div>
        <div class="batch-chart-controls">
          <label id="batch-chart-group-field">测试组 <select id="batch-chart-group"></select></label>
          <label>画质指标 <select id="batch-chart-metric"><option value="psnr">PSNR</option><option value="ssim">SSIM</option></select></label>
        </div>
        <p id="batch-chart-context" class="muted"></p>
        <div id="batch-chart-highlights" class="batch-chart-highlights" hidden></div>
        <div id="batch-chart-content" class="batch-chart-content" hidden></div>
        <p id="batch-chart-message" class="batch-chart-message" hidden></p>
      </section>
      <div id="batch-summary" class="table-scroll"></div>
      <div class="links"><a id="batch-summary-csv">下载汇总 CSV</a><a id="batch-images-csv">下载逐图 CSV</a></div>
    </section>
    <section id="batch-samples" class="panel" hidden>
      <h2>测试样本</h2>
      <div class="fields">
        <label>测试组<select id="batch-filter"></select></label>
        <label>文件名<input id="batch-search" type="search" placeholder="搜索文件名"></label>
      </div>
      <div id="batch-sample-list" class="table-scroll"></div>
      <div class="batch-actions batch-pages">
        <button id="batch-prev" type="button">上一页</button>
        <button id="batch-next" type="button">下一页</button>
        <span id="batch-page" class="muted"></span>
      </div>
    </section>
    <section id="batch-detail" class="panel" hidden aria-labelledby="batch-detail-title">
      <div class="section-title">
        <h2 id="batch-detail-title" tabindex="-1">样本详情</h2>
        <button id="batch-close-detail" type="button">关闭详情</button>
      </div>
      <div id="batch-views" class="batch-image-grid"></div>
      <details id="batch-crop" hidden>
        <summary>放大同一位置</summary>
        <div class="fields">
          <label>左右位置<input id="batch-x" type="range" min="0" max="100" value="50"></label>
          <label>上下位置<input id="batch-y" type="range" min="0" max="100" value="50"></label>
          <label>查看区域<select id="batch-size"><option value="64">64 × 64 像素</option><option value="128" selected>128 × 128 像素</option><option value="256">256 × 256 像素</option></select></label>
        </div>
        <p id="batch-crop-position" class="muted"></p>
        <div id="batch-crops" class="batch-image-grid"></div>
      </details>
    </section>
  </main>
  <script src="/static/crop-comparison.js?v=1" defer></script>
  <script src="/static/vendor/echarts/echarts.common.min.js?v=6.1.0" defer></script>
  <script src="/static/benchmark-charts.js?v=3" defer></script>
  <script src="/static/benchmark.js?v=2" defer></script>
</body>
</html>
