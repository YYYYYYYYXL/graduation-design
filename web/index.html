<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像去噪系统</title><link rel="stylesheet" href="/static/style.css?v=5"></head>
<body>
<header><a class="brand" href="/">图像去噪系统</a><nav aria-label="功能页面"><button class="active" data-tab="normal">图片去噪</button><button data-tab="experiment">实验对比</button></nav></header>
<main>
<section id="workspace">
<form id="denoise-form" class="panel">
<h2 id="form-title">图片去噪</h2><p id="intro" class="muted">减少照片里的颗粒噪点。上传照片后直接开始处理。</p>
<fieldset id="experiment-input" hidden disabled><legend>1 · 你准备了什么图片？</legend>
<div class="mode-options"><label><input type="radio" name="input-mode" value="noisy" checked>我有带噪照片<small>直接比较处理效果，不额外加噪。</small></label><label><input id="synthetic" type="radio" name="input-mode" value="clean">我有清晰照片<small>自动添加相同噪点，并计算效果指标。</small></label></div>
</fieldset>
<label class="upload"><span id="upload-label">上传图片</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif" required><span>支持手机 JPG、HEIC/HEIF，以及 PNG、WebP、BMP；合计最多 50 MB。大图自动等比例缩小到 400 万像素以内，下载的是处理后的尺寸。</span></label>
<figure id="preview" hidden><img id="preview-image" alt="待处理的照片"><figcaption id="file-info"></figcaption></figure>
<fieldset id="experiment-options" hidden disabled><legend>2 · 选择要比较的方法</legend>
<p class="muted">已选好四种方法，可取消不需要的；选得越多，等待越久。</p>
<div id="compare-models" class="checks"></div>
<details><summary>其他模型版本</summary><div id="more-models" class="checks"></div></details>
<div id="noise-options" class="fields" hidden><label>添加多少噪点<select id="noise-level"><option value="15">轻度 · 15</option><option value="25" selected>中度 · 25</option><option value="50">重度 · 50</option></select></label></div>
<details id="reference-options"><summary>我还有对应的干净照片（可选）</summary><p class="muted">同尺寸、同内容且位置对齐，才能计算 PSNR、SSIM。没有也能比较图片效果和用时。</p><label>上传干净参考图<input id="reference" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif"></label><button id="clear-reference" type="button">移除参考图</button></details>
<details><summary>高级设置（一般不用改）</summary><div class="fields"><label id="sigma-field">BM3D 噪声强度<input id="sigma" type="number" min="0" max="255" step="any" placeholder="留空自动估计"></label><label id="seed-field" hidden>随机种子<input id="seed" type="number" min="0" max="4294967295" step="1" value="42"></label></div><p class="muted">清晰照片模式下，各方法使用同一份噪声；P2N 使用已有预训练网络，不进行单图训练。</p></details>
</fieldset>
<p id="selection-error" class="error" role="alert"></p><button id="submit" class="primary" type="submit" disabled>开始去噪</button><p id="status" role="status" aria-live="polite"></p>
</form>
<section id="result-panel" class="panel" hidden><div class="section-title"><h2 id="result-title">去噪结果</h2><button id="export" disabled hidden>导出对比指标</button></div><div id="comparison-summary" hidden></div><div id="shared-input" class="images" hidden></div><div id="results"></div></section>
</section>

</main><script src="/static/app.js?v=5" defer></script>
</body></html>
