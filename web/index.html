<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像去噪系统</title><link rel="stylesheet" href="/static/style.css?v=2"></head>
<body>
<header><a class="brand" href="/">图像去噪系统</a><nav aria-label="功能页面"><button class="active" data-tab="normal">图片去噪</button><button data-tab="experiment">实验对比</button><button data-tab="progress">任务进度</button></nav></header>
<main>
<section id="workspace">
<form id="denoise-form" class="panel">
<h2 id="form-title">图片去噪</h2>
<label class="upload">上传图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp" required><span>支持 PNG、JPG、WebP、BMP；总上传不超过 25 MB，每张不超过 400 万像素。</span></label>
<div class="fields"><label><span id="model-label">去噪方法</span><select id="model" disabled></select></label></div>
<fieldset id="experiment-options" hidden><legend>实验设置</legend>
<label><input id="synthetic" type="checkbox">给干净图片添加高斯噪声</label>
<div class="fields"><label>噪声强度 σ<input id="sigma" type="number" min="0" max="255" step="any" placeholder="BM3D 留空自动估计"></label><label>随机种子<input id="seed" type="number" min="0" max="4294967295" step="1" value="42"></label><label>干净参考图（可选）<input id="reference" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label></div>
<p class="muted">计算 PSNR、SSIM 需要同尺寸且对齐的干净参考图。添加噪声时，上传原图即为参考图。</p>
<label><input id="compare" type="checkbox">比较多个模型</label><div id="compare-models" class="checks" hidden></div>
</fieldset>
<button id="submit" class="primary" type="submit" disabled>开始去噪</button><p id="status" role="status" aria-live="polite"></p>
</form>
<section id="result-panel" class="panel" hidden><div class="section-title"><h2>去噪结果</h2><button id="export" disabled hidden>导出对比指标</button></div><div id="results"></div></section>
</section>
<section id="progress-panel" class="panel" hidden><h2>任务进度</h2><p class="muted">保留任务清单原有模块、序号、功能点和顺序。原表建议值与当前状态分别显示；代码完成不代表已经完成实验或测试。</p><div id="progress" class="table-scroll"></div></section>
</main><script src="/static/app.js?v=2" defer></script>
</body></html>
