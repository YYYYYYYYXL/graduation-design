<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图像去噪系统</title><link rel="stylesheet" href="/static/style.css?v=9"></head>
<body>
<header><a class="brand" href="/">图像去噪系统</a><nav aria-label="功能页面"><button class="active" data-tab="normal">图片去噪</button><button data-tab="experiment">实验对比</button></nav></header>
<main>
<section id="workspace">
<form id="denoise-form" class="panel">
<h2 id="form-title">图片去噪</h2><p id="intro" class="muted">减少照片里的颗粒噪点。上传照片后直接开始处理。</p>
<fieldset id="experiment-input" hidden disabled><legend>1 · 你准备了什么图片？</legend>
<div class="mode-options"><label><input type="radio" name="input-mode" value="noisy" checked>我有带噪照片<small>直接去噪；有参考图看还原程度，没有则看图片质量评分。</small></label><label><input id="synthetic" type="radio" name="input-mode" value="clean">我有清晰照片<small>先添加同一份噪声，再比较谁更接近原图。</small></label></div>
</fieldset>
<label class="upload"><span id="upload-label">上传图片</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif" required><span>支持手机 JPG、HEIC/HEIF，以及 PNG、WebP、BMP；合计最多 50 MB。大图自动等比例缩小到 400 万像素以内，下载的是处理后的尺寸。</span></label>
<button id="clear-image" class="remove-image" type="button" hidden>移除上传图片</button>
<figure id="preview" hidden><img id="preview-image" alt="待处理的照片"><figcaption id="file-info"></figcaption></figure>
<fieldset id="experiment-options" hidden disabled><legend>2 · 选择要比较的方法</legend>
<p class="muted">五个模型加 BM3D，共六个对比选项。每项单独出结果，使用同一张带噪图；可取消不需要的，选得越多等待越久。</p>
<div id="compare-models" class="checks"></div>
<div id="noise-options" class="fields" hidden><label>添加多少噪点<select id="noise-level"><option value="15">轻度 · 15</option><option value="25" selected>中度 · 25</option><option value="50">重度 · 50</option></select></label></div>
<details id="reference-options"><summary>我还有对应的干净照片（可选）</summary><p class="muted">必须是同一场景、同尺寸且位置对齐，才能计算 PSNR、SSIM。没有参考图时自动计算 BRISQUE 质量评分和噪声估计。</p><label>上传干净参考图<input id="reference" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif"></label><button id="clear-reference" type="button">移除参考图</button></details>
<p id="metric-guide" class="metric-guide"></p>
</fieldset>
<p id="selection-error" class="error" role="alert"></p><button id="submit" class="primary" type="submit" disabled>开始去噪</button><p id="status" role="status" aria-live="polite"></p>
</form>
<section id="result-panel" class="panel" hidden><div class="section-title"><h2 id="result-title">去噪结果</h2><button id="export" disabled hidden>导出对比指标 CSV</button></div><div id="comparison-summary" hidden></div><div id="shared-input" class="images" hidden></div><div id="results"></div>
<details id="detail-panel" hidden><summary>放大同一位置，比较噪点和细节</summary><p class="muted">移动下面的滑块，所有图片会展示同一块区域。观察噪点是否减少，同时检查文字、头发和纹理有没有变糊。放大不改变指标。</p><div class="fields"><label>左右位置<input id="detail-x" type="range" min="0" max="100" value="50"></label><label>上下位置<input id="detail-y" type="range" min="0" max="100" value="50"></label><label>查看区域<select id="detail-size"><option value="64">64 × 64 像素</option><option value="128" selected>128 × 128 像素</option><option value="256">256 × 256 像素</option></select></label></div><p id="detail-location" class="muted"></p><div id="detail-grid" class="images"></div></details>
</section>
</section>

</main><script src="/static/app.js?v=9" defer></script>
</body></html>
