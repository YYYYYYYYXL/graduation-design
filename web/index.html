<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>单图去噪 · 图像去噪系统</title>
  <link rel="stylesheet" href="/static/compare.css?v=1">
  <link rel="stylesheet" href="/static/single.css?v=1">
</head>
<body>
  <header>
    <a class="brand" href="/">图像去噪系统</a>
    <nav aria-label="功能页面"><a class="nav-link active" aria-current="page" href="/">单图去噪</a><a class="nav-link" href="/compare">多模型效果对比</a></nav>
  </header>
  <main>
    <div class="dashboard-title"><h1>单图去噪</h1></div>
    <form id="denoise-form">
      <section class="panel" aria-labelledby="input-title">
        <div class="section-title">
          <h2 id="input-title">输入图像</h2>
          <button id="clear-image" class="remove-image" type="button" hidden>移除上传图片</button>
        </div>
        <div class="upload-box">
          <label for="image">上传图片</label>
          <input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif" aria-describedby="file-hint" required>
          <p id="file-hint" class="muted">PNG、JPEG、WebP、BMP、HEIC / HEIF · 最大 50 MB</p>
        </div>
        <p id="selection-error" class="error" role="alert"></p>
        <figure id="preview" hidden>
          <img id="preview-image" alt="待处理的照片">
          <figcaption id="file-info" class="muted"></figcaption>
        </figure>
      </section>
      <section class="panel" aria-labelledby="process-title">
        <div class="section-title"><h2 id="process-title">去噪处理</h2></div>
        <dl class="model-info"><dt>默认模型</dt><dd id="model-name">读取中…</dd></dl>
        <button id="submit" class="primary" type="submit" disabled>开始去噪</button>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </form>
    <div id="result-panel" hidden>
      <section class="panel" aria-labelledby="result-title">
        <div class="section-title"><h2 id="result-title">去噪结果</h2></div>
        <div id="results"></div>
      </section>
      <section class="panel" aria-labelledby="score-title">
        <div class="section-title"><h2 id="score-title">图像质量评分</h2></div>
        <div id="single-score-panels"></div>
      </section>
    </div>
  </main>
  <script src="/static/app.js?v=25" defer></script>
</body>
</html>
