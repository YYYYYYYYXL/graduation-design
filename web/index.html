<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单图去噪 · 图像去噪系统</title><link rel="stylesheet" href="/static/style.css?v=24"></head>
<body>
<header><a class="brand" href="/">图像去噪系统</a><nav aria-label="功能页面"><a class="nav-link active" aria-current="page" href="/">单图去噪</a><a class="nav-link" href="/compare">多模型效果对比</a></nav></header>
<main>
<section id="workspace">
<form id="denoise-form" class="panel">
<h2 id="form-title">单图去噪</h2>
<label class="upload"><span id="upload-label">上传图片</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/heic,image/heif,.heic,.heif" required></label>
<button id="clear-image" class="remove-image" type="button" hidden>移除上传图片</button>
<figure id="preview" hidden><img id="preview-image" alt="待处理的照片"><figcaption id="file-info"></figcaption></figure>
<p id="selection-error" class="error" role="alert"></p><button id="submit" class="primary" type="submit" disabled>开始去噪</button><p id="status" role="status" aria-live="polite"></p>
</form>
<section id="result-panel" class="panel" hidden><h2>去噪结果</h2>
<div id="results"></div><div id="single-score-panels" class="table-scroll"></div></section>
</section></main>
<script src="/static/app.js?v=24" defer></script>
</body></html>
