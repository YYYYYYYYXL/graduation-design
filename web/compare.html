<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>多模型效果对比 · 图像去噪系统</title>
  <link rel="stylesheet" href="/static/style.css?v=25">
</head>
<body>
  <header>
    <a class="brand" href="/">图像去噪系统</a>
    <nav aria-label="功能页面"><a class="nav-link" href="/">单图去噪</a><a class="nav-link active" aria-current="page" href="/compare">多模型效果对比</a></nav>
  </header>
  <main class="benchmark">
    <section class="panel">
      <h1>多模型效果对比</h1>
      <form id="batch-form">
        <fieldset><legend>参评模型与基线</legend><div id="batch-models" class="table-scroll"></div></fieldset>
        <fieldset><legend>共同测试集</legend><div id="batch-groups" class="checks"></div></fieldset>
        <div class="batch-actions">
          <button class="primary" id="batch-start" type="submit" disabled>开始模型评测</button>
          <button id="batch-preview" type="submit" disabled>预览 · 每组 1 张</button>
          <span id="batch-selection" class="muted"></span>
        </div>
        <p id="batch-error" class="error" role="alert"></p>
      </form>
    </section>
    <section class="panel" aria-labelledby="epoch-title">
      <div class="section-title">
        <h2 id="epoch-title">各模型训练曲线</h2>
        <label class="batch-picker">纵轴指标 <select id="epoch-metric" disabled></select></label>
      </div>
      <div id="epoch-chart" class="model-plot" aria-label="按 Epoch 对比各模型的训练记录"></div>
      <p id="epoch-note" class="muted" role="status">正在读取训练日志…</p>
    </section>
    <section id="batch-report" class="panel" hidden>
      <div class="section-title">
        <h2>评测汇总</h2>
        <label class="batch-picker">历史评测 <select id="batch-runs"></select></label>
      </div>
      <p id="batch-state" role="status"></p>
      <progress id="batch-progress" max="1" value="0" aria-label="评测进度"></progress>
      <h3>多模型定量对比</h3>
      <div id="batch-summary" class="table-scroll"></div>
      <h3>模型开销</h3>
      <label>测试组 <select id="cost-group"></select></label>
      <div id="model-costs" class="table-scroll"></div>
      <div class="links"><a id="batch-summary-csv">下载汇总 CSV</a><a id="batch-images-csv">下载逐图 CSV</a></div>
    </section>
    <section id="batch-samples" class="panel" hidden>
      <h2>测试样本</h2>
      <div class="fields">
        <label>测试组<select id="batch-filter"></select></label>
        <label>文件名<input id="batch-search" type="search" placeholder="搜索文件名"></label>
      </div>
      <div id="batch-sample-list" class="table-scroll"></div>
      <div class="batch-actions batch-pages">
        <button id="batch-prev" type="button">上一页</button>
        <button id="batch-next" type="button">下一页</button>
        <span id="batch-page" class="muted"></span>
      </div>
    </section>
  </main>
  <script src="/static/vendor/echarts/echarts.common.min.js" defer></script>
  <script src="/static/benchmark-charts.js?v=26" defer></script>
  <script src="/static/benchmark.js?v=25" defer></script>
</body>
</html>
