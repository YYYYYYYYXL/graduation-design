# 与DIV2K使用相同官方网络；SIDD读取真实噪声/GT，不添加人工噪声。
name: restormer_sidd
project_root: .
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 20261022

datasets:
  train:
    name: SIDD_train_fixed
    type: FixedPairedDataset
    data_root: data
    dataset: sidd
    use_shuffle: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    mini_batch_sizes: [1]
    iters: [300000]
    gt_size: 128
    gt_sizes: [128]
    dataset_enlarge_ratio: 1
    prefetch_mode: null
    pin_memory: true
  val:
    name: SIDD_official_val_crops
    type: FixedPairedDataset
    data_root: data
    dataset: sidd

network_g:
  type: Restormer
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  heads: [1, 2, 4, 8]
  ffn_expansion_factor: 2.66
  bias: false
  LayerNorm_type: BiasFree
  dual_pixel_task: false

path:
  experiments_root: checkpoints/restormer_sidd
  pretrain_network_g: null
  strict_load_g: true
  resume_state: null

train:
  total_iter: 300000
  warmup_iter: -1
  use_grad_clip: true
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [92000, 208000]
    restart_weights: [1, 1]
    eta_mins: [0.0003, 0.000001]
  mixing_augs:
    mixup: false
  optim_g:
    type: AdamW
    lr: !!float 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

val:
  window_size: 8
  val_freq: 5000
  save_img: false
  rgb2bgr: true
  use_image: true
  metrics:
    psnr:
      type: calculate_project_psnr
    ssim:
      type: calculate_project_ssim

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  keep_checkpoint_max: 2
  use_tb_logger: false
  wandb: null
dist_params:
  backend: gloo
  port: 29500
